<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#7C3AED"/>
  <!-- Pixel art "CB" letters -->
  <!-- C -->
  <rect x="4" y="8" width="6" height="2" fill="white"/>
  <rect x="4" y="10" width="2" height="10" fill="white"/>
  <rect x="4" y="20" width="6" height="2" fill="white"/>
  <!-- B -->
  <rect x="12" y="8" width="2" height="14" fill="white"/>
  <rect x="14" y="8" width="4" height="2" fill="white"/>
  <rect x="14" y="14" width="4" height="2" fill="white"/>
  <rect x="14" y="20" width="4" height="2" fill="white"/>
  <rect x="18" y="10" width="2" height="4" fill="white"/>
  <rect x="18" y="16" width="2" height="4" fill="white"/>
  <!-- Pixel sparkle -->
  <rect x="24" y="8" width="4" height="4" rx="1" fill="#06b6d4" opacity="0.8"/>
  <rect x="24" y="20" width="4" height="4" rx="1" fill="#9f67ff" opacity="0.8"/>
</svg>
